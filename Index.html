<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EduLite — Math & English</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">EduLite</div>
    <nav>
      <button id="nav-lessons" class="btn">Lessons</button>
      <button id="nav-quiz" class="btn">Quizzes</button>
      <button id="nav-progress" class="btn">Progress</button>
    </nav>
  </header>

  <main id="app">
    <section id="lessons" class="pane">
      <h1>Lessons</h1>
      <div class="selectors">
        <select id="subject-select">
          <option value="math">Math</option>
          <option value="english">English</option>
        </select>
        <input id="search-lesson" placeholder="Search lesson title" />
      </div>
      <div id="lesson-list" class="list"></div>
      <div id="lesson-view" class="card hidden">
        <button id="back-to-list" class="btn small">Back</button>
        <h2 id="lesson-title"></h2>
        <div id="lesson-content"></div>
        <button id="start-quiz-from-lesson" class="btn">Start Quiz</button>
      </div>
    </section>

    <section id="quiz" class="pane hidden">
      <h1>Quiz</h1>
      <div id="quiz-meta"></div>
      <div id="quiz-card" class="card"></div>
      <div class="quiz-controls">
        <button id="quiz-prev" class="btn small">Prev</button>
        <button id="quiz-next" class="btn small">Next</button>
        <button id="quiz-submit" class="btn primary">Submit</button>
      </div>
      <div id="quiz-result" class="card hidden"></div>
    </section>

    <section id="progress" class="pane hidden">
      <h1>Your Progress</h1>
      <div id="progress-list" class="list"></div>
      <button id="reset-progress" class="btn danger">Reset Progress</button>
    </section>
  </main>

  <footer class="footer">
    <small>EduLite • Static demo • Save progress in browser</small>
  </footer>

  <script src="js/app.js"></script>
</body>
  </html>
